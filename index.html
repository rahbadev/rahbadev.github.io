<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحبة التطوير | Rehba Dev</title>
    <meta name="description" content="رحبة التطوير - تطوير تطبيقات الجوال، والحلول الرقمية">
    <link rel="icon" href="site/assets/images/logo.webp" type="image/x-icon">

    <!-- Font -->
    <link href="site/assets/fonts/cairo.css" rel="stylesheet">

    <!-- Shared Variables -->
    <link rel="stylesheet" href="site/assets/css/variables.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a2332 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }


        .logo-container img {
            width: 220px;
            height: 220px;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-bottom: 60px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .option-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--secondary-color));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .option-card:hover::before {
            transform: scaleX(1);
        }

        .option-card:hover {
            transform: translateY(-8px);
            background: var(--card-hover);
            border-color: var(--primary-color);
            box-shadow: 0 20px 60px -10px rgba(45, 106, 200, 0.3);
        }

        .option-icon {
            font-size: 3.5rem;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .option-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .option-description {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .footer-note {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 40px;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .option-icon {
                font-size: 2.5rem;
            }

            .option-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo-container">
            <img src="site/assets/images/logo.webp" alt="رحبة التطوير">
            <p class="subtitle">نحول أفكارك إلى واقع رقمي</p>
        </div>

        <div class="options-grid">
            <a href="site/index.html" class="option-card">
                <div class="option-icon">🌐</div>
                <h2 class="option-title">الموقع الرئيسي</h2>
                <p class="option-description">
                    استكشف خدماتنا الكاملة، المشاريع، واحسب تكلفة مشروعك
                </p>
            </a>

            <a href="bio/index.html" class="option-card">
                <div class="option-icon">👤</div>
                <h2 class="option-title">البطاقة الشخصية</h2>
                <p class="option-description">
                    صفحة سريعة للوصول للمشاريع وطرق التواصل المباشر
                </p>
            </a>
        </div>

        <p class="footer-note">
            جميع الحقوق محفوظة © 2026 رحبة التطوير
        </p>
    </div>
</body>

</html>
