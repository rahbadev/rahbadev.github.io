name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Build Projects Pages
        run: node apps/build.js
        
      - name: 📋 Verify Build Output
        run: |
          echo "Checking if projects were built..."
          if [ -d "projects" ]; then
            echo "✅ Projects directory created"
            ls -la projects/
          else
            echo "❌ Projects directory not found!"
            exit 1
          fi
      
      - name: 🗑️ Remove .gitignore for deployment
        run: rm .gitignore
      
      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          clean: true
          force: true
