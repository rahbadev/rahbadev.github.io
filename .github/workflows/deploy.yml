name: Deploy Website

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🔨 Build Projects
        run: |
          echo "Starting build process..."
          node build.js
          echo "Build completed successfully!"
        
      - name: 📋 Verify Build Output
        run: |
          echo "=== Checking build output ==="
          
          # Check if projects directory exists
          if [ -d "projects" ]; then
            echo "✅ Projects directory created"
            echo "Contents:"
            ls -lah projects/
            
            # Check each project subdirectory
            for dir in projects/*/; do
              if [ -d "$dir" ]; then
                echo "Project: $dir"
                ls -lah "$dir"
              fi
            done
          else
            echo "❌ Projects directory not found!"
            exit 1
          fi
          
          # Verify apps directory updates
          if [ -d "apps" ]; then
            echo "✅ Apps directory exists"
            echo "Checking for generated HTML files..."
            find apps/ -name "index.html" -type f -exec echo "Found: {}" \;
          fi
          
          echo "=== Build verification complete ==="
      
      - name: 🗑️ Remove .gitignore for deployment
        run: rm .gitignore
      
      - name: 🚀 Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: . 
          branch: gh-pages
          clean: true
          force: true
