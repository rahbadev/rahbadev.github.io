<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>سياسة الخصوصية - {{TITLE}}</title>
    <meta name="description" content="سياسة الخصوصية لتطبيق {{TITLE}}">
    <link rel="icon" href="{{LOGO_PATH}}" type="image/png">

    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* prettier-ignore */
        :root {
            --primary-color: {
                    {
                    PRIMARY_COLOR
                }
            }

            ;

            --secondary-color: {
                    {
                    SECONDARY_COLOR
                }
            }

            ;

            --accent-color: {
                    {
                    ACCENT_COLOR
                }
            }

            ;

            --primary-rgb: {
                    {
                    PRIMARY_RGB
                }
            }

            ;

            --secondary-rgb: {
                    {
                    SECONDARY_RGB
                }
            }

            ;
        }

        * {
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .policy-container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .policy-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }

        .policy-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .policy-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .policy-content {
            padding: 60px 40px;
        }

        .policy-section {
            margin-bottom: 40px;
        }

        .policy-section h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--accent-color);
        }

        .policy-section p {
            color: #555;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .policy-section ul,
        .policy-section ol {
            color: #555;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .policy-section li {
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.4);
            margin-top: 30px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(var(--primary-rgb), 0.6);
            color: white;
        }

        .back-button i {
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .policy-header {
                padding: 40px 20px;
            }

            .policy-header h1 {
                font-size: 2rem;
            }

            .policy-content {
                padding: 40px 20px;
            }

            .policy-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="policy-container">
        <div class="policy-header">
            <h1>سياسة الخصوصية</h1>
            <p>{{TITLE}}</p>
        </div>

        <div class="policy-content">
            {{PRIVACY_CONTENT}}

            <div class="text-center">
                <a href="index.html" class="back-button">
                    <i class="fas fa-arrow-right"></i>
                    العودة للتطبيق
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
