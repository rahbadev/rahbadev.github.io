<!DOCTYPE html>
<html dir="rtl" lang="ar" id="html-root">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>سياسة الخصوصية - {{TITLE}}</title>
    <meta name="description" content="سياسة الخصوصية لتطبيق {{TITLE}}">
    <link rel="icon" href="{{LOGO_PATH}}" type="image/png">

    <!-- Bootstrap 5 RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* prettier-ignore */
            --primary: {{PRIMARY_COLOR}};
            /* prettier-ignore */
            --primary-rgb: {{PRIMARY_RGB}};
            /* prettier-ignore */
            --secondary: {{SECONDARY_COLOR}};
            /* prettier-ignore */
            --accent: {{ACCENT_COLOR}};
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background 0.3s ease;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(var(--primary-rgb), 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--primary-rgb), 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
            mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
        }

        .policy-container {
            max-width: 1000px;
            margin: 40px auto;
            background: var(--bg-card);
            border-radius: 30px;
            box-shadow: 0 20px 60px -10px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(var(--primary-rgb), 0.1);
            overflow: hidden;
        }

        .policy-header {
            background: linear-gradient(180deg, rgba(var(--primary-rgb), 0.15) 0%, transparent 100%);
            padding: 80px 20px 50px;
            text-align: center;
            position: relative;
        }

        .app-icon-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-icon-container::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, var(--primary), transparent 70%);
            opacity: 0.4;
            filter: blur(25px);
            animation: pulseGlow 3s infinite;
            z-index: 0;
        }

        .app-icon {
            width: 100%;
            height: 100%;
            border-radius: 35px;
            object-fit: contain;
            position: relative;
            z-index: 1;
            background: var(--bg-card);
            padding: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(var(--primary-rgb), 0.2);
            transition: transform 0.3s;
        }

        .app-icon:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .btn-back {
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 10px 30px;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            background: var(--bg-card);
            margin-top: 15px;
        }

        .btn-back:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 0.6;
                transform: scale(1.1);
            }
        }

        .policy-header h1 {
            font-weight: 900;
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #ffffff 20%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 15px rgba(var(--primary-rgb), 0.3));
        }

        [data-theme="light"] .policy-header h1 {
            background: linear-gradient(135deg, var(--text-main) 20%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .policy-header p {
            font-size: 1.2rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 40px;
        }

        .policy-content {
            padding: 60px 40px;
        }

        .policy-section {
            margin-bottom: 40px;
        }

        .policy-section h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--accent-color);
        }

        .policy-section p {
            color: var(--text-main);
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .policy-section ul,
        .policy-section ol {
            color: var(--text-main);
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .policy-section li {
            margin-bottom: 10px;
        }

        .back-button {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.4);
            margin-top: 30px;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(var(--primary-rgb), 0.6);
            color: white;
        }

        .back-button i {
            margin-left: 10px;
        }

        .lang-switcher {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: white;
        }

        .lang-btn.active {
            background: rgba(255, 255, 255, 0.3);
            color: var(--primary-color);
            border-color: white;
        }

        .content-ar,
        .content-en {
            display: none;
        }

        .content-ar.active,
        .content-en.active {
            display: block;
        }

        @media (max-width: 768px) {
            .policy-header {
                padding: 40px 20px;
            }

            .policy-header h1 {
                font-size: 2rem;
            }

            .policy-content {
                padding: 40px 20px;
            }

            .policy-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="policy-container">
        <div class="policy-header">
            <div class="lang-switcher">
                <button class="lang-btn active" data-lang="ar" onclick="switchLang('ar')">العربية</button>
                <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
            </div>
            <div class="app-icon-container">
                <img src="{{LOGO_PATH}}" alt="{{TITLE}}" class="app-icon">
            </div>
            <h1>{{TITLE}}</h1>
            <p id="page-title">سياسة الخصوصية</p>
        </div>

        <div class="policy-content">
            <div class="content-ar active">
                {{PRIVACY_CONTENT_AR}}
            </div>

            <div class="content-en">
                {{PRIVACY_CONTENT_EN}}
            </div>

            <div class="text-center">
                <a href="index.html" class="btn-back">
                    <i class="fa-solid fa-arrow-right ms-2"></i> <span id="back-text">العودة للتطبيق</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function switchLang(lang) {
            const html = document.getElementById('html-root');
            const title = document.getElementById('page-title');
            const backText = document.getElementById('back-text');
            const langBtns = document.querySelectorAll('.lang-btn');
            const arContent = document.querySelector('.content-ar');
            const enContent = document.querySelector('.content-en');

            // Update active button
            langBtns.forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            // Switch content and direction
            if (lang === 'ar') {
                html.setAttribute('dir', 'rtl');
                html.setAttribute('lang', 'ar');
                title.textContent = 'سياسة الخصوصية';
                backText.textContent = 'العودة للتطبيق';
                arContent.classList.add('active');
                enContent.classList.remove('active');
            } else {
                html.setAttribute('dir', 'ltr');
                html.setAttribute('lang', 'en');
                title.textContent = 'Privacy Policy';
                backText.textContent = 'Back to App';
                enContent.classList.add('active');
                arContent.classList.remove('active');
            }

            // Save preference
            localStorage.setItem('preferred-lang', lang);
        }

        // Load saved preference
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('preferred-lang') || 'ar';
            if (savedLang === 'en') {
                switchLang('en');
            }
        });
    </script>
</body>

</html>
