<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحبة التطوير | RehbaDev Bio</title>
    <meta name="description" content="نحول أفكارك إلى واقع رقمي - حلول رقمية متكاملة">
    <link rel="icon" href="../shared/images/icon.ico" type="image/x-icon">

    <!-- Fonts -->
    <link href="../shared/fonts/cairo.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../shared/vendor/fontawesome/all.min.css">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../shared/css/variables.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--dark-alt) 50%, var(--dark-bg) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .bio-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 30px 0;
        }

        /* Header */
        .bio-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(var(--primary-rgb), 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .bio-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            padding: 5px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border-radius: 50%;
            box-shadow: 0 8px 30px rgba(var(--primary-rgb), 0.4);
        }

        .bio-logo img {
            width: 100%;
            height: 100%;
            padding: 12px;
            background: var(--dark-alt);
            border-radius: 50%;
            object-fit: contain;
        }

        .bio-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio-tagline {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .bio-description {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* What We Offer - 2 Columns */
        .services-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .service-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(var(--primary-rgb), 0.2);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .service-item:hover {
            border-color: var(--primary-color);
            background: rgba(30, 41, 59, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(var(--primary-rgb), 0.3);
        }

        .service-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }

        .service-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .service-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Links */
        .links-section {
            margin-bottom: 32px;
        }

        .link-btn {
            position: relative;
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px 24px;
            margin-bottom: 14px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(30, 41, 59, 0.6));
            border: 2px solid rgba(var(--primary-rgb), 0.2);
            border-radius: 18px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .link-btn:hover {
            border-color: var(--primary-color);
            transform: translateX(-8px) translateY(-2px);
            box-shadow: 0 12px 35px rgba(var(--primary-rgb), 0.35),
                0 0 20px rgba(var(--primary-rgb), 0.15);
        }

        .link-btn:hover::before {
            opacity: 0.1;
        }

        .link-btn i {
            font-size: 1.6rem;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            border-radius: 14px;
            color: white;
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(var(--primary-rgb), 0.3);
            transition: transform 0.3s ease;
        }

        .link-btn:hover i {
            transform: scale(1.1) rotate(5deg);
        }

        .link-btn-content {
            flex: 1;
            text-align: right;
        }

        .link-btn-title {
            display: block;
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 4px;
            letter-spacing: -0.01em;
        }

        .link-btn-desc {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* WhatsApp Special */
        .link-btn.whatsapp {
            background: linear-gradient(135deg, rgba(37, 211, 102, 0.15), rgba(18, 140, 126, 0.1));
            border-color: rgba(var(--success-rgb), 0.4);
        }

        .link-btn.whatsapp::before {
            background: linear-gradient(135deg, var(--success-color), #128C7E);
        }

        .link-btn.whatsapp:hover {
            border-color: var(--success-color);
            box-shadow: 0 12px 35px rgba(var(--success-rgb), 0.4),
                0 0 20px rgba(var(--success-rgb), 0.2);
        }

        .link-btn.whatsapp i {
            background: linear-gradient(135deg, var(--success-color), #128C7E);
            box-shadow: 0 4px 15px rgba(var(--success-rgb), 0.4);
        }

        /* Social Icons */
        .social-section {
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(var(--primary-rgb), 0.15);
        }

        .social-section .section-title {
            margin-bottom: 24px;
            font-size: 1.2rem;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(30, 41, 59, 0.6));
            border: 2px solid rgba(var(--primary-rgb), 0.3);
            border-radius: 16px;
            color: var(--text-secondary);
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .social-icon::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .social-icon:hover {
            transform: translateY(-6px) scale(1.08);
        }

        .social-icon:hover::before {
            width: 100%;
            height: 100%;
        }

        .social-icon.facebook::before {
            background: #1877f2;
        }

        .social-icon.facebook:hover {
            border-color: #1877f2;
            color: white;
            box-shadow: 0 8px 25px rgba(24, 119, 242, 0.5);
        }

        .social-icon.twitter::before {
            background: #1da1f2;
        }

        .social-icon.twitter:hover {
            border-color: #1da1f2;
            color: white;
            box-shadow: 0 8px 25px rgba(29, 161, 242, 0.5);
        }

        .social-icon.github::before {
            background: #333;
        }

        .social-icon.github:hover {
            border-color: #333;
            color: white;
            box-shadow: 0 8px 25px rgba(51, 51, 51, 0.5);
        }

        .social-icon.telegram::before {
            background: #0088cc;
        }

        .social-icon.telegram:hover {
            border-color: #0088cc;
            color: white;
            box-shadow: 0 8px 25px rgba(0, 136, 204, 0.5);
        }

        .social-icon.playstore::before {
            background: #34a853;
        }

        .social-icon.playstore:hover {
            border-color: #34a853;
            color: white;
            box-shadow: 0 8px 25px rgba(52, 168, 83, 0.5);
        }

        .social-icon.email::before {
            background: #ea4335;
        }

        .social-icon.email:hover {
            border-color: #ea4335;
            color: white;
            box-shadow: 0 8px 25px rgba(234, 67, 53, 0.5);
        }

        .social-icon i {
            position: relative;
            z-index: 1;
        }

        /* Footer */
        .bio-footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .bio-footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(var(--primary-rgb), 0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .bio-title {
                font-size: 1.6rem;
            }

            .service-icon {
                font-size: 2rem;
            }

            .services-grid {
                gap: 10px;
            }

            .service-item {
                padding: 16px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="bio-container">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px;">جاري التحميل...</p>
        </div>

        <!-- Content (Hidden Until Loaded) -->
        <div id="content" style="display: none;">
            <!-- Header -->
            <div class="bio-header">
                <div class="bio-logo">
                    <img src="../shared/images/logo.webp" alt="Rehba Dev" id="logo">
                </div>
                <h1 class="bio-title" id="companyName">رحبة التطوير</h1>
                <p class="bio-tagline" id="tagline">نحول أفكارك إلى واقع رقمي</p>
                <p class="bio-description" id="description">حلول رقمية متكاملة</p>
            </div>

            <!-- What We Offer -->
            <div class="services-section">
                <h2 class="section-title">ماذا نقدم؟</h2>
                <div class="services-grid" id="servicesGrid">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Links -->
            <div class="links-section">
                <a href="#" class="link-btn whatsapp" id="whatsappLink">
                    <i class="fab fa-whatsapp"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">تواصل معنا عبر واتساب</span>
                        <span class="link-btn-desc">تواصل مباشر وسريع</span>
                    </div>
                </a>

                <a href="../site/index.html" class="link-btn">
                    <i class="fas fa-globe"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">الموقع الإلكتروني</span>
                        <span class="link-btn-desc">تعرّف على خدماتنا وأعمالنا</span>
                    </div>
                </a>

                <a href="../site/index.html#calculator" class="link-btn">
                    <i class="fas fa-calculator"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">احسب تكلفة مشروعك</span>
                        <span class="link-btn-desc">حاسبة ذكية لتقدير التكلفة</span>
                    </div>
                </a>
            </div>

            <!-- Social Icons -->
            <div class="social-section">
                <h2 class="section-title">تابعنا على</h2>
                <div class="social-icons" id="socialIcons">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Footer -->
            <div class="bio-footer">
                <p>&copy; <span id="year"></span> <span id="footerName">رحبة التطوير</span></p>
                <p style="margin-top: 8px;">
                    <a href="mailto:rahbadev@gmail.com" id="footerEmail">rahbadev@gmail.com</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Load company data
        async function loadData() {
            try {
                // Load company info
                const companyResponse = await fetch('../shared/data/company-info.json');
                const companyData = await companyResponse.json();

                // Load services from the main services file
                const servicesResponse = await fetch('../site/data/services.json');
                const servicesData = await servicesResponse.json();

                // Update header
                document.getElementById('companyName').textContent = companyData.company.name;
                document.getElementById('tagline').textContent = companyData.company.tagline;
                document.getElementById('description').textContent = companyData.company.descriptionLong;

                // Update services grid - Show all categories in 2 columns
                const servicesGrid = document.getElementById('servicesGrid');
                servicesGrid.innerHTML = servicesData.categories.map(category => `
                    <div class="service-item">
                        <div class="service-icon" style="color: ${category.color};">
                            <i class="${category.icon}"></i>
                        </div>
                        <div class="service-title">${category.title}</div>
                        <div class="service-desc">${category.description}</div>
                    </div>
                `).join('');

                // Update WhatsApp link
                document.getElementById('whatsappLink').href = companyData.contact.whatsappLink;

                // Update social icons
                const socialIcons = document.getElementById('socialIcons');
                const socialLinks = [];

                if (companyData.contact.email) {
                    socialLinks.push(`<a href="mailto:${companyData.contact.email}" class="social-icon email" title="البريد الإلكتروني"><i class="fas fa-envelope"></i></a>`);
                }
                if (companyData.contact.telegramLink) {
                    socialLinks.push(`<a href="${companyData.contact.telegramLink}" class="social-icon telegram" target="_blank" title="تيليجرام"><i class="fab fa-telegram-plane"></i></a>`);
                }
                if (companyData.social.facebook) {
                    socialLinks.push(`<a href="${companyData.social.facebook}" class="social-icon facebook" target="_blank" title="فيسبوك"><i class="fab fa-facebook-f"></i></a>`);
                }
                if (companyData.social.twitter) {
                    socialLinks.push(`<a href="${companyData.social.twitter}" class="social-icon twitter" target="_blank" title="تويتر"><i class="fab fa-twitter"></i></a>`);
                }
                if (companyData.social.github) {
                    socialLinks.push(`<a href="${companyData.social.github}" class="social-icon github" target="_blank" title="جيت هاب"><i class="fab fa-github"></i></a>`);
                }
                if (companyData.social.playstore) {
                    socialLinks.push(`<a href="${companyData.social.playstore}" class="social-icon playstore" target="_blank" title="متجر جوجل بلاي"><i class="fab fa-google-play"></i></a>`);
                }

                socialIcons.innerHTML = socialLinks.join('');

                // Update footer
                document.getElementById('year').textContent = new Date().getFullYear();
                document.getElementById('footerName').textContent = companyData.company.name;
                document.getElementById('footerEmail').href = `mailto:${companyData.contact.email}`;
                document.getElementById('footerEmail').textContent = companyData.contact.email;

                // Show content, hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = '<p style="color: var(--danger-color);">حدث خطأ في تحميل البيانات</p>';
            }
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
