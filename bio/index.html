<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحبة التطوير | RehbaDev Bio</title>
    <meta name="description" content="نحول أفكارك إلى واقع رقمي - حلول رقمية متكاملة">
    <link rel="icon" href="../shared/images/icon.ico" type="image/x-icon">

    <!-- Fonts -->
    <link href="../shared/fonts/cairo.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="../shared/vendor/fontawesome/all.min.css">
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../shared/css/variables.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .bio-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 30px 0;
        }

        /* Header */
        .bio-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(45, 106, 200, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .bio-logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            padding: 5px;
            background: linear-gradient(135deg, #2d6ac8 0%, #f472b6 100%);
            border-radius: 50%;
            box-shadow: 0 8px 30px rgba(45, 106, 200, 0.4);
        }

        .bio-logo img {
            width: 100%;
            height: 100%;
            padding: 12px;
            background: #1e293b;
            border-radius: 50%;
            object-fit: contain;
        }

        .bio-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2d6ac8 0%, #f472b6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio-tagline {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }

        .bio-description {
            font-size: 0.95rem;
            color: #94a3b8;
        }

        /* What We Offer - 2 Columns */
        .services-section {
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #f1f5f9;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .service-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(45, 106, 200, 0.2);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .service-item:hover {
            border-color: #2d6ac8;
            background: rgba(30, 41, 59, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(45, 106, 200, 0.3);
        }

        .service-icon {
            font-size: 2.5rem;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #2d6ac8 0%, #f472b6 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .service-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #f1f5f9;
        }

        .service-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* Links */
        .links-section {
            margin-bottom: 32px;
        }

        .link-btn {
            display: block;
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(45, 106, 200, 0.3);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 12px;
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .link-btn:hover {
            border-color: #2d6ac8;
            background: rgba(45, 106, 200, 0.15);
            transform: translateX(-5px);
            box-shadow: 0 6px 20px rgba(45, 106, 200, 0.3);
        }

        .link-btn i {
            font-size: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2d6ac8 0%, #f472b6 100%);
            border-radius: 10px;
            color: white;
            flex-shrink: 0;
        }

        .link-btn-content {
            flex: 1;
            text-align: right;
        }

        .link-btn-title {
            display: block;
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .link-btn-desc {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* WhatsApp Special */
        .link-btn.whatsapp {
            background: rgba(37, 211, 102, 0.1);
            border-color: rgba(37, 211, 102, 0.3);
        }

        .link-btn.whatsapp:hover {
            border-color: #25D366;
            background: rgba(37, 211, 102, 0.2);
        }

        .link-btn.whatsapp i {
            background: linear-gradient(135deg, #25D366, #128C7E);
        }

        /* Social Icons */
        .social-section {
            margin-bottom: 40px;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .social-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(45, 106, 200, 0.3);
            border-radius: 12px;
            color: #cbd5e1;
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-icon:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 6px 20px rgba(45, 106, 200, 0.4);
        }

        .social-icon.facebook:hover {
            background: #1877f2;
            border-color: #1877f2;
            color: white;
        }

        .social-icon.twitter:hover {
            background: #1da1f2;
            border-color: #1da1f2;
            color: white;
        }

        .social-icon.github:hover {
            background: #333;
            border-color: #333;
            color: white;
        }

        .social-icon.telegram:hover {
            background: #0088cc;
            border-color: #0088cc;
            color: white;
        }

        .social-icon.playstore:hover {
            background: #34a853;
            border-color: #34a853;
            color: white;
        }

        .social-icon.email:hover {
            background: #ea4335;
            border-color: #ea4335;
            color: white;
        }

        /* Footer */
        .bio-footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
        }

        .bio-footer a {
            color: #2d6ac8;
            text-decoration: none;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(45, 106, 200, 0.2);
            border-top-color: #2d6ac8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .bio-title {
                font-size: 1.6rem;
            }

            .service-icon {
                font-size: 2rem;
            }

            .services-grid {
                gap: 10px;
            }

            .service-item {
                padding: 16px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="bio-container">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px;">جاري التحميل...</p>
        </div>

        <!-- Content (Hidden Until Loaded) -->
        <div id="content" style="display: none;">
            <!-- Header -->
            <div class="bio-header">
                <div class="bio-logo">
                    <img src="../shared/images/logo.webp" alt="Rehba Dev" id="logo">
                </div>
                <h1 class="bio-title" id="companyName">رحبة التطوير</h1>
                <p class="bio-tagline" id="tagline">نحول أفكارك إلى واقع رقمي</p>
                <p class="bio-description" id="description">حلول رقمية متكاملة</p>
            </div>

            <!-- What We Offer -->
            <div class="services-section">
                <h2 class="section-title">ماذا نقدم؟</h2>
                <div class="services-grid" id="servicesGrid">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Links -->
            <div class="links-section">
                <a href="#" class="link-btn whatsapp" id="whatsappLink">
                    <i class="fab fa-whatsapp"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">تواصل معنا عبر واتساب</span>
                        <span class="link-btn-desc">تواصل مباشر وسريع</span>
                    </div>
                </a>

                <a href="../site/index.html" class="link-btn">
                    <i class="fas fa-globe"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">الموقع الإلكتروني</span>
                        <span class="link-btn-desc">تعرّف على خدماتنا وأعمالنا</span>
                    </div>
                </a>

                <a href="../site/index.html#calculator" class="link-btn">
                    <i class="fas fa-calculator"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">احسب تكلفة مشروعك</span>
                        <span class="link-btn-desc">حاسبة ذكية لتقدير التكلفة</span>
                    </div>
                </a>
            </div>

            <!-- Social Icons -->
            <div class="social-section">
                <h2 class="section-title">تابعنا على</h2>
                <div class="social-icons" id="socialIcons">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Footer -->
            <div class="bio-footer">
                <p>&copy; <span id="year"></span> <span id="footerName">رحبة التطوير</span></p>
                <p style="margin-top: 8px;">
                    <a href="mailto:rahbadev@gmail.com" id="footerEmail">rahbadev@gmail.com</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Load company data
        async function loadData() {
            try {
                const response = await fetch('../shared/data/company-info.json');
                const data = await response.json();

                // Update header
                document.getElementById('companyName').textContent = data.company.name;
                document.getElementById('tagline').textContent = data.company.tagline;
                document.getElementById('description').textContent = data.company.descriptionLong;

                // Update services grid
                const servicesGrid = document.getElementById('servicesGrid');
                servicesGrid.innerHTML = data.services.map(service => `
                    <div class="service-item">
                        <div class="service-icon">
                            <i class="fas ${service.icon}"></i>
                        </div>
                        <div class="service-title">${service.title}</div>
                        <div class="service-desc">${service.description}</div>
                    </div>
                `).join('');

                // Update WhatsApp link
                document.getElementById('whatsappLink').href = data.contact.whatsappLink;

                // Update social icons
                const socialIcons = document.getElementById('socialIcons');
                const socialLinks = [];

                if (data.contact.email) {
                    socialLinks.push(`<a href="mailto:${data.contact.email}" class="social-icon email" title="البريد الإلكتروني"><i class="fas fa-envelope"></i></a>`);
                }
                if (data.contact.telegramLink) {
                    socialLinks.push(`<a href="${data.contact.telegramLink}" class="social-icon telegram" target="_blank" title="تيليجرام"><i class="fab fa-telegram-plane"></i></a>`);
                }
                if (data.social.facebook) {
                    socialLinks.push(`<a href="${data.social.facebook}" class="social-icon facebook" target="_blank" title="فيسبوك"><i class="fab fa-facebook-f"></i></a>`);
                }
                if (data.social.twitter) {
                    socialLinks.push(`<a href="${data.social.twitter}" class="social-icon twitter" target="_blank" title="تويتر"><i class="fab fa-twitter"></i></a>`);
                }
                if (data.social.github) {
                    socialLinks.push(`<a href="${data.social.github}" class="social-icon github" target="_blank" title="جيت هاب"><i class="fab fa-github"></i></a>`);
                }
                if (data.social.playstore) {
                    socialLinks.push(`<a href="${data.social.playstore}" class="social-icon playstore" target="_blank" title="متجر جوجل بلاي"><i class="fab fa-google-play"></i></a>`);
                }

                socialIcons.innerHTML = socialLinks.join('');

                // Update footer
                document.getElementById('year').textContent = new Date().getFullYear();
                document.getElementById('footerName').textContent = data.company.name;
                document.getElementById('footerEmail').href = `mailto:${data.contact.email}`;
                document.getElementById('footerEmail').textContent = data.contact.email;

                // Show content, hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = '<p style="color: #ef4444;">حدث خطأ في تحميل البيانات</p>';
            }
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>

</html>
