<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحبة التطوير | RehbaDev Bio</title>
    <meta name="description" content="نحول أفكارك إلى واقع رقمي - حلول رقمية متكاملة">
    <link rel="icon" href="../site/assets/images/logo.webp" type="image/x-icon">

    <!-- Fonts -->
    <link href="../site/assets/fonts/cairo.css" rel="stylesheet">
    <!-- Font Awesome (CDN) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Shared Styles -->
    <link rel="stylesheet" href="../site/assets/css/variables.css">
    <link rel="stylesheet" href="../site/assets/css/main.css">
</head>

<body class="bio-page">
    <div class="bio-container">
        <!-- Loading State -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 20px;">جاري التحميل...</p>
        </div>

        <!-- Content (Hidden Until Loaded) -->
        <div id="content" style="display: none;">
            <!-- Header -->
            <div class="bio-header">
                <div class="bio-logo">
                    <img src="../site/assets/images/brand-blue.webp" alt="Rehba Dev" id="logo">
                </div>
                <h1 class="bio-title" id="companyName">رحبة التطوير</h1>
                <p class="bio-tagline" id="tagline">نحول أفكارك إلى واقع رقمي</p>
                <p class="bio-description" id="description">حلول رقمية متكاملة</p>
            </div>

            <!-- What We Offer -->
            <div class="services-section">
                <h2 class="section-title">ماذا نقدم؟</h2>
                <div class="services-grid" id="servicesGrid">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Links -->
            <div class="links-section">
                <a href="#" class="link-btn whatsapp" id="whatsappLink">
                    <i class="fab fa-whatsapp"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">تواصل معنا عبر واتساب</span>
                        <span class="link-btn-desc">تواصل مباشر وسريع</span>
                    </div>
                </a>

                <a href="../site/index.html" class="link-btn">
                    <i class="fas fa-globe"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">الموقع الإلكتروني</span>
                        <span class="link-btn-desc">تعرّف على خدماتنا وأعمالنا</span>
                    </div>
                </a>

                <a href="../site/index.html#services" class="link-btn">
                    <i class="fas fa-calculator"></i>
                    <div class="link-btn-content">
                        <span class="link-btn-title">خدماتنا ومشاريعنا</span>
                        <span class="link-btn-desc">استكشف خدماتنا ومشاريعنا بالتفصيل</span>
                    </div>
                </a>
            </div>

            <!-- Social Icons -->
            <div class="social-section">
                <h2 class="section-title">حساباتنا</h2>
                <div class="social-icons" id="socialIcons">
                    <!-- Will be populated by JS -->
                </div>
            </div>

            <!-- Footer -->
            <div class="bio-footer">
                <p>&copy; <span id="year"></span> <span id="footerName">رحبة التطوير</span></p>
                <p style="margin-top: 8px;">
                    <a href="mailto:rahbadev@gmail.com" id="footerEmail">rahbadev@gmail.com</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Load DataService -->
    <script src="../site/assets/js/logger.js"></script>
    <script src="../site/assets/js/data-service.js"></script>
    <script src="../site/assets/js/contact-updater.js"></script>

    <script>
        // Load services grid only (contact info is handled by contact-updater.js)
        async function loadServices() {
            try {
                // Load services from DataService
                const servicesData = await dataService.getServices();

                // Update services grid - Show all categories in 2 columns
                const servicesGrid = document.getElementById('servicesGrid');
                servicesGrid.innerHTML = servicesData.categories.map(category => `
                    <div class="service-item">
                        <div class="service-icon" style="color: ${category.color};">
                            <i class="${category.icon}"></i>
                        </div>
                        <div class="service-title">${category.title}</div>
                        <div class="service-desc">${category.description}</div>
                    </div>
                `).join('');

                // Show content, hide loading
                document.getElementById('loading').style.display = 'none';
                document.getElementById('content').style.display = 'block';

                logger.success('تم تحميل خدمات البايو');

            } catch (error) {
                logger.error('خطأ في تحميل بيانات البايو', error);
                document.getElementById('loading').innerHTML = '<p style="color: var(--danger-color);">حدث خطأ في تحميل البيانات</p>';
            }
        }

        // Load on page ready
        document.addEventListener('DOMContentLoaded', loadServices);
    </script>
</body>

</html>
