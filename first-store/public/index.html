<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="متجر إلكتروني لبيع الجوالات والإلكترونيات">
    <meta name="theme-color" content="#000000">

    <title>متجرك الإلكتروني</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'cairo': ['Cairo', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            font-family: 'Cairo', sans-serif;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Loading skeleton animation */
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }

            100% {
                background-position: 1000px 0;
            }
        }

        .skeleton {
            animation: shimmer 2s infinite;
            background: linear-gradient(to right, #f0f0f0 4%, #e0e0e0 25%, #f0f0f0 36%);
            background-size: 1000px 100%;
        }

        /* Cart badge pulse */
        @keyframes pulse-scale {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .cart-badge-pulse {
            animation: pulse-scale 0.3s ease-in-out;
        }

        /* Fade in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Hide scrollbar but keep functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-gray-50" x-data x-cloak>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0">
                    <h1 class="text-2xl font-bold" x-text="$store.shop.config.store.name || 'المتجر'"></h1>
                    <p class="text-xs text-gray-500" x-text="$store.shop.config.store.tagline"></p>
                </div>

                <!-- Search (Desktop) -->
                <div class="hidden md:block flex-1 max-w-md mx-8">
                    <div class="relative">
                        <input type="text" x-model="$store.shop.searchQuery"
                            @input.debounce.300ms="$store.shop.applyFilters()" placeholder="ابحث عن منتج..."
                            class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>

                <!-- Cart Button -->
                <div class="flex items-center gap-4">
                    <button @click="$store.shop.showCart = true"
                        class="relative p-2 text-gray-700 hover:text-blue-600 transition">
                        <i class="ri-shopping-cart-line text-2xl"></i>
                        <span x-show="$store.shop.cartCount > 0" x-text="$store.shop.cartCount"
                            class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold"
                            :class="$store.shop.cartBadgePulse && 'cart-badge-pulse'"></span>
                    </button>
                </div>
            </div>

            <!-- Search (Mobile) -->
            <div class="md:hidden pb-3">
                <div class="relative">
                    <input type="text" x-model="$store.shop.searchQuery"
                        @input.debounce.300ms="$store.shop.applyFilters()" placeholder="ابحث عن منتج..."
                        class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- Filters Section -->
        <div class="mb-8" x-show="$store.shop.categories.length > 0 || $store.shop.brands.length > 0">
            <div class="bg-white rounded-lg shadow-sm p-4">
                <!-- Category Filter -->
                <div class="mb-4" x-show="$store.shop.categories.length > 0">
                    <div id="category-filter" class="fade-in"></div>
                </div>

                <!-- Brand Filter -->
                <div x-show="$store.shop.brands.length > 0">
                    <label class="block text-sm font-semibold mb-2 text-gray-700">الماركة</label>
                    <select x-model="$store.shop.selectedBrand" @change="$store.shop.applyFilters()"
                        class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">جميع الماركات</option>
                        <template x-for="brand in $store.shop.brands" :key="brand">
                            <option :value="brand" x-text="brand"></option>
                        </template>
                    </select>
                </div>

                <!-- Variant Filter -->
                <div class="mt-4">
                    <label class="block text-sm font-semibold mb-2 text-gray-700">الحالة</label>
                    <select x-model="$store.shop.selectedVariant" @change="$store.shop.applyFilters()"
                        class="w-full md:w-64 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="">الكل</option>
                        <option value="new">جديد</option>
                        <option value="used">مستعمل</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Featured Products Banner -->
        <div x-show="$store.shop.featuredProducts.length > 0" class="mb-8">
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg shadow-lg p-6 text-white">
                <h2 class="text-2xl font-bold mb-2">🔥 منتجات مميزة</h2>
                <p class="text-blue-100">تحقق من أحدث العروض والمنتجات المميزة لدينا</p>
            </div>
        </div>

        <!-- Loading State -->
        <div x-show="$store.shop.loading" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="i in 6" :key="i">
                <div class="bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="skeleton h-48 w-full"></div>
                    <div class="p-4 space-y-3">
                        <div class="skeleton h-4 w-3/4 rounded"></div>
                        <div class="skeleton h-4 w-1/2 rounded"></div>
                        <div class="skeleton h-8 w-full rounded"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Products Grid -->
        <div x-show="!$store.shop.loading" id="products-grid"
            class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in"></div>

        <!-- Empty State -->
        <div x-show="!$store.shop.loading && $store.shop.filteredProducts.length === 0" class="text-center py-16">
            <i class="ri-inbox-line text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">لا توجد منتجات</h3>
            <p class="text-gray-500">جرب البحث بكلمات مختلفة أو قم بإزالة الفلاتر</p>
            <button @click="$store.shop.clearFilters()"
                class="mt-4 px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">
                مسح الفلاتر
            </button>
        </div>
    </main>

    <!-- Shopping Cart Sidebar -->
    <div x-show="$store.shop.showCart" @click.self="$store.shop.showCart = false"
        x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black bg-opacity-50 z-50">
        <div x-show="$store.shop.showCart" @click.stop x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="translate-x-0"
            x-transition:leave-end="translate-x-full"
            class="absolute left-0 top-0 h-full w-full max-w-md bg-white shadow-xl flex flex-col">
            <!-- Cart Header -->
            <div class="flex items-center justify-between p-4 border-b">
                <h2 class="text-xl font-bold">السلة (<span x-text="$store.shop.cartCount"></span>)</h2>
                <button @click="$store.shop.showCart = false" class="p-2 hover:bg-gray-100 rounded-full transition">
                    <i class="ri-close-line text-2xl"></i>
                </button>
            </div>

            <!-- Cart Items -->
            <div class="flex-1 overflow-y-auto p-4">
                <!-- Empty Cart -->
                <div x-show="$store.shop.cart.length === 0" class="text-center py-16">
                    <i class="ri-shopping-cart-line text-6xl text-gray-300 mb-4"></i>
                    <p class="text-gray-500">السلة فارغة</p>
                </div>

                <!-- Cart Items List -->
                <div x-show="$store.shop.cart.length > 0" class="space-y-4">
                    <template x-for="(item, index) in $store.shop.cart" :key="index">
                        <div class="flex gap-4 bg-gray-50 rounded-lg p-3">
                            <!-- Product Image -->
                            <img :src="item.image_url" :alt="item.name" class="w-20 h-20 object-cover rounded-lg"
                                loading="lazy">

                            <!-- Product Info -->
                            <div class="flex-1">
                                <h3 class="font-semibold text-sm mb-1" x-text="item.name"></h3>
                                <p class="text-xs text-gray-500 mb-2">
                                    <span x-text="item.variant === 'new' ? 'جديد' : 'مستعمل'"></span>
                                </p>
                                <div class="flex items-center justify-between">
                                    <!-- Quantity Controls -->
                                    <div class="flex items-center gap-2">
                                        <button @click="$store.shop.updateCartQuantity(index, item.quantity - 1)"
                                            class="w-6 h-6 flex items-center justify-center bg-gray-200 rounded hover:bg-gray-300 transition">
                                            <i class="ri-subtract-line"></i>
                                        </button>
                                        <span class="w-8 text-center font-semibold" x-text="item.quantity"></span>
                                        <button @click="$store.shop.updateCartQuantity(index, item.quantity + 1)"
                                            class="w-6 h-6 flex items-center justify-center bg-gray-200 rounded hover:bg-gray-300 transition">
                                            <i class="ri-add-line"></i>
                                        </button>
                                    </div>

                                    <!-- Price -->
                                    <span class="font-bold text-blue-600"
                                        x-text="(item.price * item.quantity).toLocaleString('ar-SA') + ' ريال'"></span>
                                </div>
                            </div>

                            <!-- Remove Button -->
                            <button @click="$store.shop.removeFromCart(index)"
                                class="text-red-500 hover:text-red-600 transition">
                                <i class="ri-delete-bin-line text-xl"></i>
                            </button>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Cart Footer -->
            <div x-show="$store.shop.cart.length > 0" class="border-t p-4 space-y-4">
                <!-- Total -->
                <div class="flex items-center justify-between text-lg font-bold">
                    <span>المجموع:</span>
                    <span class="text-blue-600" x-text="$store.shop.cartTotal.toLocaleString('ar-SA') + ' ريال'"></span>
                </div>

                <!-- WhatsApp Checkout Button -->
                <button @click="$store.shop.checkout()"
                    class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="ri-whatsapp-line text-2xl"></i>
                    <span>إتمام الطلب عبر واتساب</span>
                </button>

                <!-- Continue Shopping -->
                <button @click="$store.shop.showCart = false"
                    class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-6 rounded-lg transition">
                    متابعة التسوق
                </button>
            </div>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div x-show="$store.shop.showProductModal" @click.self="$store.shop.closeProductModal()"
        x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div x-show="$store.shop.showProductModal" @click.stop x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-90" x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-90"
            class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <template x-if="$store.shop.selectedProduct">
                <div>
                    <!-- Modal Header -->
                    <div class="sticky top-0 bg-white border-b px-6 py-4 flex items-center justify-between">
                        <h2 class="text-xl font-bold" x-text="$store.shop.selectedProduct.name"></h2>
                        <button @click="$store.shop.closeProductModal()"
                            class="p-2 hover:bg-gray-100 rounded-full transition">
                            <i class="ri-close-line text-2xl"></i>
                        </button>
                    </div>

                    <!-- Modal Body -->
                    <div class="p-6 space-y-4">
                        <!-- Product Image -->
                        <img :src="$store.shop.selectedProduct.image_url" :alt="$store.shop.selectedProduct.name"
                            class="w-full h-96 object-contain rounded-lg bg-gray-50">

                        <!-- Product Info -->
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm font-semibold"
                                    x-text="$store.shop.selectedProduct.category"></span>
                                <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-sm"
                                    x-text="$store.shop.selectedProduct.brand"></span>
                            </div>

                            <p class="text-gray-600 leading-relaxed" x-text="$store.shop.selectedProduct.description">
                            </p>
                        </div>

                        <!-- Variants -->
                        <div x-show="$store.shop.selectedProduct.price_new || $store.shop.selectedProduct.price_used">
                            <label class="block text-sm font-semibold mb-2 text-gray-700">اختر الحالة</label>
                            <div class="grid grid-cols-2 gap-4">
                                <template x-if="$store.shop.selectedProduct.price_new">
                                    <button @click="$store.shop.selectedVariant = 'new'"
                                        :class="$store.shop.selectedVariant === 'new' ? 'border-blue-500 bg-blue-50' : 'border-gray-300'"
                                        class="border-2 rounded-lg p-4 transition hover:border-blue-400">
                                        <div class="font-semibold mb-1">جديد</div>
                                        <div class="text-lg font-bold text-blue-600"
                                            x-text="$store.shop.selectedProduct.price_new.toLocaleString('ar-SA') + ' ريال'">
                                        </div>
                                    </button>
                                </template>

                                <template x-if="$store.shop.selectedProduct.price_used">
                                    <button @click="$store.shop.selectedVariant = 'used'"
                                        :class="$store.shop.selectedVariant === 'used' ? 'border-blue-500 bg-blue-50' : 'border-gray-300'"
                                        class="border-2 rounded-lg p-4 transition hover:border-blue-400">
                                        <div class="font-semibold mb-1">مستعمل</div>
                                        <div class="text-lg font-bold text-blue-600"
                                            x-text="$store.shop.selectedProduct.price_used.toLocaleString('ar-SA') + ' ريال'">
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex gap-3 pt-4">
                            <button
                                @click="$store.shop.addToCart($store.shop.selectedProduct, $store.shop.selectedVariant)"
                                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition flex items-center justify-center gap-2">
                                <i class="ri-shopping-cart-line text-xl"></i>
                                <span>إضافة للسلة</span>
                            </button>

                            <button
                                @click="$store.shop.orderNow($store.shop.selectedProduct, $store.shop.selectedVariant)"
                                class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg transition flex items-center justify-center gap-2">
                                <i class="ri-whatsapp-line text-xl"></i>
                                <span>اطلب الآن</span>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-16">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <!-- Store Info -->
                <div>
                    <h3 class="text-lg font-bold mb-4" x-text="$store.shop.config.store.name"></h3>
                    <p class="text-gray-400 text-sm" x-text="$store.shop.config.store.description"></p>
                </div>

                <!-- Contact -->
                <div>
                    <h3 class="text-lg font-bold mb-4">تواصل معنا</h3>
                    <div class="space-y-2 text-sm">
                        <div class="flex items-center gap-2">
                            <i class="ri-phone-line"></i>
                            <span x-text="$store.shop.config.contact.phone"></span>
                        </div>
                        <div class="flex items-center gap-2" x-show="$store.shop.config.contact.email">
                            <i class="ri-mail-line"></i>
                            <span x-text="$store.shop.config.contact.email"></span>
                        </div>
                    </div>
                </div>

                <!-- Social Links -->
                <div x-show="$store.shop.config.features.socialLinks">
                    <h3 class="text-lg font-bold mb-4">تابعنا</h3>
                    <div class="flex gap-3">
                        <a href="#"
                            class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-600 transition">
                            <i class="ri-facebook-fill text-xl"></i>
                        </a>
                        <a href="#"
                            class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center hover:bg-pink-600 transition">
                            <i class="ri-instagram-line text-xl"></i>
                        </a>
                        <a href="#"
                            class="w-10 h-10 bg-gray-700 rounded-full flex items-center justify-center hover:bg-blue-400 transition">
                            <i class="ri-twitter-x-line text-xl"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div class="mt-8 pt-8 border-t border-gray-700 text-center text-sm text-gray-400">
                <p x-text="$store.shop.config.store.name + ' © ' + new Date().getFullYear() + ' - جميع الحقوق محفوظة'">
                </p>
            </div>
        </div>
    </footer>

    <!-- Configuration (Must be first) -->
    <script src="config.js"></script>

    <!-- Services -->
    <script src="src/services/database.service.js"></script>
    <script src="src/services/whatsapp.service.js"></script>

    <!-- Components -->
    <script src="src/components/layouts.js"></script>

    <!-- Utilities -->
    <script src="src/utils/helpers.js"></script>

    <!-- Core Application (Must be last) -->
    <script src="src/core/app.js"></script>

    <!-- Initialize Application -->
    <script>
        document.addEventListener('alpine:init', () => {
            // Application is initialized through app.js
            // All Alpine stores are registered there
        });

        // Render products when data loads
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for Alpine to initialize
            setTimeout(() => {
                const shop = Alpine.store('shop');
                if (shop) {
                    // Watch for products changes and re-render
                    Alpine.effect(() => {
                        const products = shop.filteredProducts;
                        if (products && products.length > 0) {
                            renderProducts();
                        }
                    });

                    // Watch for categories and render filter
                    Alpine.effect(() => {
                        const categories = shop.categories;
                        if (categories && categories.length > 0) {
                            renderCategoryFilter();
                        }
                    });
                }
            }, 100);
        });

        // Render products grid
        function renderProducts() {
            const container = document.getElementById('products-grid');
            if (!container) return;

            const shop = Alpine.store('shop');
            const products = shop.filteredProducts;
            const layout = shop.config.layouts.productCard;

            // Use layout renderer from layouts.js
            if (window.ProductCardLayouts && window.ProductCardLayouts[layout]) {
                const html = window.ProductCardLayouts[layout](products, shop);
                container.innerHTML = html;
            } else {
                console.error('Layout not found:', layout);
            }
        }

        // Render category filter
        function renderCategoryFilter() {
            const container = document.getElementById('category-filter');
            if (!container) return;

            const shop = Alpine.store('shop');
            const categories = shop.categories;
            const layout = shop.config.layouts.categoryFilter;

            // Use layout renderer from layouts.js
            if (window.CategoryFilterLayouts && window.CategoryFilterLayouts[layout]) {
                const html = window.CategoryFilterLayouts[layout](categories, shop);
                container.innerHTML = html;
            } else {
                console.error('Category filter layout not found:', layout);
            }
        }
    </script>
</body>

</html>
