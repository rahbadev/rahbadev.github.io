<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - Rehba Store Admin</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Project Files -->
    <script src="theme-config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/database.js"></script>
    <link rel="stylesheet" href="assets/css/components.css">

    <style>
        :root {
            --color-primary: #007AFF;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Cairo', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background: linear-gradient(180deg, #F5F5F7 0%, #E8E8ED 100%);
        }

        [x-cloak] {
            display: none !important;
        }

        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--color-primary), #5856D6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

<body x-data="adminPanel()" x-init="init()" class="antialiased">

    <!-- Header -->
    <header class="glass shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div
                        class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg">
                        <i class="ri-dashboard-line"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold gradient-text">لوحة الإدارة</h1>
                        <p class="text-sm text-gray-600" x-text="StoreThemeConfig.store.name"></p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <a href="index-apple.html"
                        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-2xl flex items-center gap-2 shadow-lg transition-all">
                        <i class="ri-store-line"></i>
                        <span>عرض المتجر</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-12">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-12">
            <div class="glass rounded-3xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <i class="ri-box-3-line text-4xl text-blue-500"></i>
                    <span class="text-3xl font-bold gradient-text" x-text="products.length"></span>
                </div>
                <p class="text-gray-600 font-medium">إجمالي المنتجات</p>
            </div>

            <div class="glass rounded-3xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <i class="ri-fire-fill text-4xl text-red-500"></i>
                    <span class="text-3xl font-bold gradient-text"
                        x-text="products.filter(p => p.is_offer).length"></span>
                </div>
                <p class="text-gray-600 font-medium">عروض مميزة</p>
            </div>

            <div class="glass rounded-3xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <i class="ri-sparkling-fill text-4xl text-yellow-500"></i>
                    <span class="text-3xl font-bold gradient-text"
                        x-text="products.filter(p => p.is_new).length"></span>
                </div>
                <p class="text-gray-600 font-medium">منتجات جديدة</p>
            </div>

            <div class="glass rounded-3xl p-6 shadow-xl">
                <div class="flex items-center justify-between mb-4">
                    <i class="ri-check-line text-4xl text-green-500"></i>
                    <span class="text-3xl font-bold gradient-text"
                        x-text="products.filter(p => p.is_available).length"></span>
                </div>
                <p class="text-gray-600 font-medium">متاح للبيع</p>
            </div>
        </div>

        <!-- Add Product Button -->
        <div class="mb-8">
            <button @click="showAddForm = true"
                class="px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 text-white font-bold rounded-2xl shadow-xl flex items-center gap-3 transition-all">
                <i class="ri-add-circle-line text-2xl"></i>
                <span>إضافة منتج جديد</span>
            </button>
        </div>

        <!-- Products Table -->
        <div class="glass rounded-3xl overflow-hidden shadow-xl">
            <div class="p-6 border-b border-gray-200">
                <h2 class="text-2xl font-bold flex items-center gap-3">
                    <i class="ri-list-check-2"></i>
                    قائمة المنتجات
                </h2>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">الصورة</th>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">المنتج</th>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">العلامة</th>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">السعر</th>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">الحالة</th>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">علامات</th>
                            <th class="px-6 py-4 text-right text-sm font-bold text-gray-700">الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <template x-for="product in products" :key="product.id">
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="px-6 py-4">
                                    <img :src="product.image" :alt="product.name"
                                        class="w-16 h-16 object-cover rounded-xl">
                                </td>
                                <td class="px-6 py-4">
                                    <div class="font-bold text-gray-900" x-text="product.name"></div>
                                    <div class="text-sm text-gray-500 line-clamp-1" x-text="product.description"></div>
                                </td>
                                <td class="px-6 py-4 text-gray-700 font-medium" x-text="product.brand"></td>
                                <td class="px-6 py-4">
                                    <span class="text-lg font-bold text-blue-600" x-text="`$${product.price}`"></span>
                                </td>
                                <td class="px-6 py-4">
                                    <span class="px-3 py-1 rounded-full text-xs font-bold"
                                        :class="product.condition === 'New' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'"
                                        x-text="product.condition === 'New' ? 'جديد' : 'مستعمل'">
                                    </span>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex flex-wrap gap-2">
                                        <span x-show="product.is_offer"
                                            class="px-2 py-1 bg-red-100 text-red-700 rounded-lg text-xs font-bold">
                                            🔥 عرض
                                        </span>
                                        <span x-show="product.is_new"
                                            class="px-2 py-1 bg-blue-100 text-blue-700 rounded-lg text-xs font-bold">
                                            ✨ جديد
                                        </span>
                                        <span x-show="product.is_available"
                                            class="px-2 py-1 bg-green-100 text-green-700 rounded-lg text-xs font-bold">
                                            ✓ متاح
                                        </span>
                                    </div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="flex gap-2">
                                        <button @click="editProductItem(product)"
                                            class="p-2 hover:bg-blue-50 text-blue-600 rounded-xl transition-colors"
                                            title="تعديل">
                                            <i class="ri-edit-line text-xl"></i>
                                        </button>
                                        <button @click="deleteProductItem(product.id)"
                                            class="p-2 hover:bg-red-50 text-red-600 rounded-xl transition-colors"
                                            title="حذف">
                                            <i class="ri-delete-bin-line text-xl"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div x-show="products.length === 0" class="text-center py-20">
                <i class="ri-inbox-line text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">لا توجد منتجات حالياً</p>
            </div>

            <!-- Loading -->
            <div x-show="loading" class="text-center py-20">
                <div
                    class="inline-block w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin">
                </div>
                <p class="text-gray-600 mt-4">جاري التحميل...</p>
            </div>
        </div>
    </main>

    <!-- Product Form Modal -->
    <div x-show="showAddForm" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0" @click="showAddForm = false"
        class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-6" x-cloak>

        <div @click.stop x-transition:enter="transition ease-out duration-300 transform"
            x-transition:enter-start="scale-95 opacity-0" x-transition:enter-end="scale-100 opacity-100"
            x-transition:leave="transition ease-in duration-200 transform"
            x-transition:leave-start="scale-100 opacity-100" x-transition:leave-end="scale-95 opacity-0"
            class="glass rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl">

            <!-- Header -->
            <div class="p-6 border-b border-gray-200 flex items-center justify-between">
                <h3 class="text-2xl font-bold">
                    <i class="ri-add-box-line"></i>
                    <span x-text="editMode ? 'تعديل المنتج' : 'إضافة منتج جديد'"></span>
                </h3>
                <button @click="showAddForm = false" class="p-2 hover:bg-gray-100 rounded-xl transition-colors">
                    <i class="ri-close-line text-2xl"></i>
                </button>
            </div>

            <!-- Form -->
            <form @submit.prevent="submitProduct()" class="p-6 space-y-6">
                <!-- Product Name -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="ri-smartphone-line"></i> اسم المنتج
                    </label>
                    <input type="text" x-model="formData.name" required placeholder="مثال: iPhone 14 Pro Max"
                        class="w-full px-4 py-3 bg-white rounded-2xl border-2 border-gray-200 focus:border-blue-500 outline-none transition-colors">
                </div>

                <!-- Brand -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="ri-apple-line"></i> العلامة التجارية
                    </label>
                    <input type="text" x-model="formData.brand" required placeholder="مثال: Apple"
                        class="w-full px-4 py-3 bg-white rounded-2xl border-2 border-gray-200 focus:border-blue-500 outline-none transition-colors">
                </div>

                <!-- Price -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="ri-money-dollar-circle-line"></i> السعر ($)
                    </label>
                    <input type="number" x-model="formData.price" required step="0.01" min="0" placeholder="999.99"
                        class="w-full px-4 py-3 bg-white rounded-2xl border-2 border-gray-200 focus:border-blue-500 outline-none transition-colors">
                </div>

                <!-- Condition -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="ri-check-double-line"></i> الحالة
                    </label>
                    <select x-model="formData.condition"
                        class="w-full px-4 py-3 bg-white rounded-2xl border-2 border-gray-200 focus:border-blue-500 outline-none transition-colors cursor-pointer">
                        <option value="New">جديد</option>
                        <option value="Used">مستعمل</option>
                    </select>
                </div>

                <!-- Description -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="ri-file-text-line"></i> الوصف
                    </label>
                    <textarea x-model="formData.description" rows="3" placeholder="وصف تفصيلي للمنتج..."
                        class="w-full px-4 py-3 bg-white rounded-2xl border-2 border-gray-200 focus:border-blue-500 outline-none transition-colors resize-none"></textarea>
                </div>

                <!-- Image Upload -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">
                        <i class="ri-image-line"></i> الصورة
                    </label>
                    <input type="file" @change="uploadImage($event)" accept="image/*"
                        class="w-full px-4 py-3 bg-white rounded-2xl border-2 border-gray-200 focus:border-blue-500 outline-none transition-colors">
                    <div x-show="uploading" class="mt-2 text-sm text-gray-600">
                        <i class="ri-loader-4-line animate-spin"></i> جاري رفع الصورة وضغطها...
                    </div>
                    <div x-show="formData.image" class="mt-2">
                        <img :src="formData.image" class="w-32 h-32 object-cover rounded-xl">
                    </div>
                </div>

                <!-- Flags -->
                <div class="grid grid-cols-3 gap-4">
                    <label
                        class="flex items-center gap-3 p-4 bg-white rounded-2xl border-2 border-gray-200 cursor-pointer hover:border-blue-500 transition-colors">
                        <input type="checkbox" x-model="formData.is_available"
                            class="w-5 h-5 rounded text-blue-600 focus:ring-blue-500">
                        <span class="text-sm font-medium">متاح للبيع</span>
                    </label>

                    <label
                        class="flex items-center gap-3 p-4 bg-white rounded-2xl border-2 border-gray-200 cursor-pointer hover:border-red-500 transition-colors">
                        <input type="checkbox" x-model="formData.is_offer"
                            class="w-5 h-5 rounded text-red-600 focus:ring-red-500">
                        <span class="text-sm font-medium">عرض خاص</span>
                    </label>

                    <label
                        class="flex items-center gap-3 p-4 bg-white rounded-2xl border-2 border-gray-200 cursor-pointer hover:border-green-500 transition-colors">
                        <input type="checkbox" x-model="formData.is_new"
                            class="w-5 h-5 rounded text-green-600 focus:ring-green-500">
                        <span class="text-sm font-medium">جديد</span>
                    </label>
                </div>

                <!-- Actions -->
                <div class="flex gap-4 pt-6 border-t border-gray-200">
                    <button type="submit" :disabled="saving"
                        class="flex-1 py-4 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 disabled:from-gray-400 disabled:to-gray-500 text-white font-bold rounded-2xl shadow-xl transition-all flex items-center justify-center gap-3">
                        <i class="ri-save-line text-xl" x-show="!saving"></i>
                        <div class="w-5 h-5 border-3 border-white border-t-transparent rounded-full animate-spin"
                            x-show="saving"></div>
                        <span x-text="saving ? 'جاري الحفظ...' : (editMode ? 'حفظ التعديلات' : 'إضافة المنتج')"></span>
                    </button>

                    <button type="button" @click="showAddForm = false"
                        class="px-8 py-4 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold rounded-2xl transition-colors">
                        إلغاء
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function adminPanel() {
            return {
                products: [],
                loading: false,
                showAddForm: false,
                editMode: false,
                saving: false,
                uploading: false,

                formData: {
                    id: null,
                    name: '',
                    brand: '',
                    price: 0,
                    condition: 'New',
                    description: '',
                    image: '',
                    is_available: true,
                    is_offer: false,
                    is_new: false
                },

                async init() {
                    console.log('🎛️ تهيئة لوحة الإدارة...');
                    StoreUtils.initThemeVariables();
                    await this.fetchProducts();
                },

                async fetchProducts() {
                    this.loading = true;
                    try {
                        this.products = await StoreDatabase.getProducts();
                        console.log(`✅ تم جلب ${this.products.length} منتج`);
                    } catch (error) {
                        console.error('❌ خطأ:', error);
                        alert('حدث خطأ في جلب المنتجات');
                    } finally {
                        this.loading = false;
                    }
                },

                resetForm() {
                    this.formData = {
                        id: null,
                        name: '',
                        brand: '',
                        price: 0,
                        condition: 'New',
                        description: '',
                        image: '',
                        is_available: true,
                        is_offer: false,
                        is_new: false
                    };
                    this.editMode = false;
                },

                async uploadImage(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    this.uploading = true;
                    try {
                        this.formData.image = await StoreDatabase.uploadImage(file);
                        console.log('✅ تم رفع الصورة');
                    } catch (error) {
                        alert('❌ فشل رفع الصورة');
                    } finally {
                        this.uploading = false;
                    }
                },

                editProductItem(product) {
                    this.formData = { ...product };
                    this.editMode = true;
                    this.showAddForm = true;
                },

                async submitProduct() {
                    this.saving = true;
                    try {
                        if (this.editMode) {
                            await StoreDatabase.updateProduct(this.formData.id, this.formData);
                            alert('✅ تم تحديث المنتج بنجاح');
                        } else {
                            await StoreDatabase.addProduct(this.formData);
                            alert('✅ تم إضافة المنتج بنجاح');
                        }

                        this.showAddForm = false;
                        this.resetForm();
                        await this.fetchProducts();
                    } catch (error) {
                        console.error('❌ خطأ:', error);
                        alert('حدث خطأ في حفظ المنتج');
                    } finally {
                        this.saving = false;
                    }
                },

                async deleteProductItem(id) {
                    if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;

                    try {
                        await StoreDatabase.deleteProduct(id);
                        alert('✅ تم حذف المنتج بنجاح');
                        await this.fetchProducts();
                    } catch (error) {
                        console.error('❌ خطأ:', error);
                        alert('حدث خطأ في حذف المنتج');
                    }
                }
            };
        }
    </script>

</body>

</html>
