<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجر رحبة - Rehba Store</title>

    <!-- CDN Resources -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Project Files -->
    <script src="theme-config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/database.js"></script>
    <script src="assets/js/store.js"></script>
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/layout.css">
</head>

<body x-data="{
    cartOpen: false,
    mobileMenuOpen: false,
    scrollTo(id) {
        document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
    }
}" x-init="$store.shop.init()" class="antialiased" x-cloak>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 right-0 z-50 glass-dark shadow-lg">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex items-center justify-between h-20">

                <!-- Logo -->
                <a href="#hero" @click.prevent="scrollTo('hero')" class="flex items-center gap-3">
                    <div
                        class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center text-white text-2xl shadow-lg">
                        <i class="ri-smartphone-line"></i>
                    </div>
                    <div class="hidden md:block">
                        <span class="text-lg font-bold gradient-text" x-text="StoreThemeConfig.store.name"></span>
                    </div>
                </a>

                <!-- Search -->
                <div class="hidden md:flex flex-1 max-w-md mx-8">
                    <div class="relative w-full">
                        <i class="ri-search-line absolute right-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" x-model="$store.shop.filters.search" @input="scrollTo('catalog')"
                            placeholder="ابحث..."
                            class="w-full pr-12 pl-4 py-3 search-input rounded-xl border-2 border-transparent focus:border-blue-500 outline-none">
                    </div>
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-3">
                    <button @click="cartOpen = true" class="relative p-3 rounded-xl hover:bg-gray-100">
                        <i class="ri-shopping-cart-2-line text-2xl"></i>
                        <span x-show="$store.shop.cartCount > 0" x-text="$store.shop.cartCount"
                            class="absolute -top-1 -right-1 min-w-[22px] h-5 px-1 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center"></span>
                    </button>

                    <a :href="`https://wa.me/${StoreThemeConfig.store.contact.phone}`" target="_blank"
                        class="px-4 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl flex items-center gap-2 shadow-lg">
                        <i class="ri-whatsapp-line text-xl"></i>
                        <span class="hidden md:inline">تواصل</span>
                    </a>

                    <button @click="mobileMenuOpen = !mobileMenuOpen"
                        class="md:hidden p-3 rounded-xl hover:bg-gray-100">
                        <i :class="mobileMenuOpen ? 'ri-close-line' : 'ri-menu-line'" class="text-2xl"></i>
                    </button>
                </div>
            </div>

            <!-- Mobile Menu -->
            <div x-show="mobileMenuOpen" x-transition class="md:hidden py-4 border-t">
                <input type="text" x-model="$store.shop.filters.search" @input="scrollTo('catalog')"
                    placeholder="ابحث..."
                    class="w-full px-4 py-3 rounded-xl border-2 focus:border-blue-500 outline-none mb-3">

                <div class="space-y-2">
                    <a @click.prevent="scrollTo('featured'); mobileMenuOpen = false"
                        class="block p-3 rounded-xl hover:bg-blue-50 cursor-pointer font-semibold">
                        <i class="ri-fire-fill text-red-500"></i> عروض مميزة
                    </a>
                    <a @click.prevent="scrollTo('catalog'); mobileMenuOpen = false"
                        class="block p-3 rounded-xl hover:bg-blue-50 cursor-pointer font-semibold">
                        <i class="ri-grid-fill text-blue-500"></i> جميع المنتجات
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section (Simplified) -->
    <section id="hero" class="pt-32 pb-16 hero-gradient">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <div class="inline-flex items-center gap-2 glass px-4 py-2 rounded-full mb-6 shadow-lg">
                <span class="relative flex h-2 w-2">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
                <span class="text-sm font-bold">متاح الآن</span>
            </div>

            <h1 class="text-5xl md:text-7xl font-black mb-6">
                <span x-text="StoreThemeConfig.store.name" class="gradient-text block"></span>
            </h1>

            <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto" x-text="StoreThemeConfig.store.tagline"></p>

            <div class="flex items-center justify-center gap-4 mb-12">
                <button @click="scrollTo('catalog')"
                    class="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold rounded-xl shadow-xl">
                    <i class="ri-shopping-bag-3-fill"></i> تسوق الآن
                </button>
                <button @click="scrollTo('featured')"
                    class="px-8 py-4 glass-dark hover:bg-white font-bold rounded-xl border-2">
                    <i class="ri-fire-fill text-red-500"></i> العروض
                </button>
            </div>

            <div class="flex items-center justify-center gap-6 text-sm text-gray-600">
                <div><i class="ri-shield-check-fill text-green-500"></i> ضمان أصلي</div>
                <div><i class="ri-truck-fill text-blue-500"></i> شحن مجاني</div>
                <div><i class="ri-customer-service-2-fill text-purple-500"></i> دعم 24/7</div>
            </div>
        </div>
    </section>

    <!-- Featured Products -->
    <section id="featured" class="py-16">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-4xl font-bold mb-8">
                <i class="ri-fire-fill text-red-500"></i> عروض مميزة
            </h2>

            <div class="grid md:grid-cols-3 gap-6" x-show="$store.shop.featuredProducts.length">
                <template x-for="product in $store.shop.featuredProducts" :key="product.id">
                    <!-- Product Card Component -->
                    <div class="product-card">
                        <div class="relative h-64 bg-gray-100">
                            <img :src="product.image" :alt="product.name" class="w-full h-full object-cover">
                            <div class="absolute top-4 right-4">
                                <span class="badge bg-red-500 text-white">عرض</span>
                            </div>
                        </div>
                        <div class="p-6">
                            <div class="text-sm text-gray-500 mb-2" x-text="product.brand"></div>
                            <h3 class="text-xl font-bold mb-2 line-clamp-2" x-text="product.name"></h3>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-2" x-text="product.description"></p>
                            <div class="text-2xl font-bold gradient-text mb-4"
                                x-text="StoreUtils.formatCurrency(product.price)"></div>
                            <div class="flex gap-2">
                                <button @click="$store.shop.sendWhatsApp(product)"
                                    class="flex-1 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl">
                                    <i class="ri-whatsapp-line"></i> اطلب
                                </button>
                                <button @click="$store.shop.addToCart(product)"
                                    class="p-3 glass hover:glass-dark rounded-xl">
                                    <i class="ri-shopping-cart-line"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </section>

    <!-- All Products -->
    <section id="catalog" class="py-16">
        <div class="max-w-7xl mx-auto px-6">
            <h2 class="text-4xl font-bold mb-8">
                <i class="ri-smartphone-line"></i> جميع المنتجات
            </h2>

            <!-- Filters -->
            <div class="glass rounded-2xl p-6 mb-8">
                <div class="grid md:grid-cols-3 gap-4">
                    <input type="text" x-model="$store.shop.filters.search" placeholder="بحث..."
                        class="px-4 py-3 rounded-xl border-2 focus:border-blue-500 outline-none">

                    <select x-model="$store.shop.filters.category"
                        class="px-4 py-3 rounded-xl border-2 focus:border-blue-500 outline-none">
                        <option value="all">الكل</option>
                        <option value="new">جديد</option>
                        <option value="used">مستعمل</option>
                    </select>

                    <select x-model="$store.shop.filters.brand"
                        class="px-4 py-3 rounded-xl border-2 focus:border-blue-500 outline-none">
                        <option value="all">جميع العلامات</option>
                        <template x-for="brand in $store.shop.availableBrands">
                            <option :value="brand" x-text="brand"></option>
                        </template>
                    </select>
                </div>
            </div>

            <!-- Loading -->
            <div x-show="$store.shop.ui.loading" class="grid md:grid-cols-3 gap-6">
                <template x-for="i in 6">
                    <div class="skeleton-card">
                        <div class="skeleton-image h-64"></div>
                        <div class="p-6 space-y-3">
                            <div class="skeleton h-4 w-1/4"></div>
                            <div class="skeleton h-6 w-3/4"></div>
                            <div class="skeleton h-4"></div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Products Grid -->
            <div class="grid md:grid-cols-3 gap-6" x-show="!$store.shop.ui.loading && $store.shop.products.length">
                <template x-for="product in $store.shop.products" :key="product.id">
                    <div class="product-card">
                        <div class="relative h-64 bg-gray-100">
                            <img :src="product.image" :alt="product.name" class="w-full h-full object-cover">
                            <template x-if="product.is_new">
                                <div class="absolute top-4 right-4">
                                    <span class="badge bg-blue-500 text-white">جديد</span>
                                </div>
                            </template>
                        </div>
                        <div class="p-6">
                            <div class="text-sm text-gray-500 mb-2" x-text="product.brand"></div>
                            <h3 class="text-xl font-bold mb-2 line-clamp-2" x-text="product.name"></h3>
                            <p class="text-gray-600 text-sm mb-4 line-clamp-2" x-text="product.description"></p>
                            <div class="text-2xl font-bold gradient-text mb-4"
                                x-text="StoreUtils.formatCurrency(product.price)"></div>
                            <div class="flex gap-2">
                                <button @click="$store.shop.sendWhatsApp(product)"
                                    class="flex-1 py-3 bg-green-500 hover:bg-green-600 text-white font-semibold rounded-xl">
                                    <i class="ri-whatsapp-line"></i> اطلب
                                </button>
                                <button @click="$store.shop.addToCart(product)"
                                    class="p-3 glass hover:glass-dark rounded-xl">
                                    <i class="ri-shopping-cart-line"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Load More -->
            <div x-show="$store.shop.hasMore && !$store.shop.ui.loading" class="text-center mt-8">
                <button @click="$store.shop.loadMore()"
                    class="px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white font-bold rounded-xl">
                    تحميل المزيد <i class="ri-arrow-down-line"></i>
                </button>
            </div>

            <!-- Empty State -->
            <div x-show="!$store.shop.ui.loading && !$store.shop.products.length" class="text-center py-20">
                <i class="ri-search-line text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 mb-4">لا توجد منتجات</p>
                <button @click="$store.shop.clearFilters()"
                    class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-xl">
                    مسح الفلاتر
                </button>
            </div>
        </div>
    </section>

    <!-- Cart Sidebar -->
    <div x-show="cartOpen" x-transition @click="cartOpen = false" class="fixed inset-0 bg-black/50 z-50" x-cloak>
        <div @click.stop class="absolute top-0 left-0 h-full w-full md:w-96 glass-dark flex flex-col">

            <!-- Header -->
            <div class="p-6 border-b">
                <div class="flex justify-between">
                    <h3 class="text-xl font-bold">
                        السلة (<span x-text="$store.shop.cartCount"></span>)
                    </h3>
                    <button @click="cartOpen = false" class="p-2 hover:bg-gray-100 rounded-xl">
                        <i class="ri-close-line text-2xl"></i>
                    </button>
                </div>
            </div>

            <!-- Items -->
            <div class="flex-1 overflow-y-auto p-6">
                <template x-if="!$store.shop.cartItems.length">
                    <div class="text-center py-20">
                        <i class="ri-shopping-cart-line text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-500">السلة فارغة</p>
                    </div>
                </template>

                <div class="space-y-4">
                    <template x-for="item in $store.shop.cartItems" :key="item.id">
                        <div class="bg-white rounded-xl p-4">
                            <div class="flex gap-4">
                                <img :src="item.image" class="w-20 h-20 object-cover rounded-xl">
                                <div class="flex-1">
                                    <h4 class="font-bold mb-1 line-clamp-1" x-text="item.name"></h4>
                                    <div class="text-lg font-bold gradient-text"
                                        x-text="StoreUtils.formatCurrency(item.price)"></div>
                                </div>
                                <button @click="$store.shop.removeFromCart(item.id)" class="text-red-500 h-fit">
                                    <i class="ri-delete-bin-line text-xl"></i>
                                </button>
                            </div>

                            <div class="flex justify-between items-center mt-4 pt-4 border-t">
                                <span class="text-sm text-gray-600">الكمية:</span>
                                <div class="flex gap-2">
                                    <button @click="$store.shop.updateQuantity(item.id, item.quantity - 1)"
                                        class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200">
                                        <i class="ri-subtract-line"></i>
                                    </button>
                                    <span class="w-8 text-center font-bold" x-text="item.quantity"></span>
                                    <button @click="$store.shop.updateQuantity(item.id, item.quantity + 1)"
                                        class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200">
                                        <i class="ri-add-line"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-6 border-t bg-white" x-show="$store.shop.cartItems.length">
                <div class="flex justify-between mb-4">
                    <span class="font-medium">المجموع:</span>
                    <span class="text-2xl font-bold gradient-text"
                        x-text="StoreUtils.formatCurrency($store.shop.cartTotal)"></span>
                </div>

                <button @click="$store.shop.sendCartWhatsApp()"
                    class="w-full py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-xl">
                    <i class="ri-whatsapp-line text-xl"></i> إتمام الطلب
                </button>

                <button @click="$store.shop.clearCart()"
                    class="w-full mt-2 py-3 text-red-500 hover:bg-red-50 font-semibold rounded-xl">
                    مسح السلة
                </button>
            </div>
        </div>
    </div>

    <!-- Footer (Simplified) -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-6">
            <div class="grid md:grid-cols-3 gap-8 mb-8">

                <!-- About -->
                <div>
                    <div class="flex items-center gap-2 mb-4">
                        <div
                            class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center">
                            <i class="ri-smartphone-line text-xl"></i>
                        </div>
                        <h3 class="text-lg font-bold" x-text="StoreThemeConfig.store.name"></h3>
                    </div>
                    <p class="text-gray-400 text-sm mb-4" x-text="StoreThemeConfig.store.description"></p>

                    <div class="flex gap-2">
                        <a :href="`https://wa.me/${StoreThemeConfig.store.contact.phone}`" target="_blank"
                            class="w-10 h-10 rounded-lg bg-green-500/20 hover:bg-green-500 flex items-center justify-center">
                            <i class="ri-whatsapp-fill"></i>
                        </a>
                        <a href="#"
                            class="w-10 h-10 rounded-lg bg-blue-500/20 hover:bg-blue-500 flex items-center justify-center">
                            <i class="ri-facebook-fill"></i>
                        </a>
                        <a href="#"
                            class="w-10 h-10 rounded-lg bg-pink-500/20 hover:bg-pink-500 flex items-center justify-center">
                            <i class="ri-instagram-fill"></i>
                        </a>
                    </div>
                </div>

                <!-- Links -->
                <div>
                    <h4 class="font-bold mb-4">روابط سريعة</h4>
                    <div class="space-y-2 text-sm">
                        <a @click.prevent="scrollTo('featured')"
                            class="block text-gray-400 hover:text-white cursor-pointer">عروض مميزة</a>
                        <a @click.prevent="scrollTo('catalog')"
                            class="block text-gray-400 hover:text-white cursor-pointer">جميع المنتجات</a>
                        <a @click.prevent="cartOpen = true"
                            class="block text-gray-400 hover:text-white cursor-pointer">سلة التسوق</a>
                    </div>
                </div>

                <!-- Contact -->
                <div>
                    <h4 class="font-bold mb-4">تواصل معنا</h4>
                    <div class="space-y-3 text-sm">
                        <a :href="`tel:${StoreThemeConfig.store.contact.displayPhone}`"
                            class="flex items-center gap-2 text-gray-400 hover:text-white">
                            <i class="ri-phone-fill"></i>
                            <span x-text="StoreThemeConfig.store.contact.displayPhone"></span>
                        </a>
                        <a :href="`mailto:${StoreThemeConfig.store.contact.email}`"
                            class="flex items-center gap-2 text-gray-400 hover:text-white">
                            <i class="ri-mail-fill"></i>
                            <span x-text="StoreThemeConfig.store.contact.email"></span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="pt-6 border-t border-gray-800 text-center text-sm text-gray-400">
                <p>&copy; <span x-text="new Date().getFullYear()"></span> <span
                        x-text="StoreThemeConfig.store.name"></span>. جميع الحقوق محفوظة.</p>
            </div>
        </div>
    </footer>

    <!-- Back to Top -->
    <button @click="scrollTo('hero')"
        class="fixed bottom-8 left-8 w-12 h-12 bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-xl z-40">
        <i class="ri-arrow-up-line text-xl"></i>
    </button>

</body>

</html>
