<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>تسجيل الدخول - لوحة التحكم</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.0.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Cairo Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>

    <style>
        * {
            font-family: 'Cairo', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-500 to-purple-600 min-h-screen flex items-center justify-center p-4">

    <div x-data="loginPanel()" x-init="init()" x-cloak class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 px-8 py-12 text-center">
                <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="ri-lock-line text-4xl text-blue-600"></i>
                </div>
                <h1 class="text-2xl font-bold text-white mb-2">لوحة التحكم</h1>
                <p class="text-blue-100 text-sm">تسجيل الدخول إلى نظام إدارة المنتجات</p>
            </div>

            <!-- Login Form -->
            <div class="p-8">
                <form @submit.prevent="login()" class="space-y-6">
                    <!-- Password Input -->
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-gray-700">كلمة المرور</label>
                        <div class="relative">
                            <input :type="showPassword ? 'text' : 'password'" x-model="password" required autofocus
                                placeholder="أدخل كلمة المرور"
                                class="w-full px-4 py-3 pl-12 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <i class="ri-lock-password-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                            <button type="button" @click="showPassword = !showPassword"
                                class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i :class="showPassword ? 'ri-eye-off-line' : 'ri-eye-line'"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div x-show="errorMessage"
                        class="bg-red-50 border border-red-200 rounded-lg p-3 flex items-center gap-2">
                        <i class="ri-error-warning-line text-red-600"></i>
                        <p class="text-sm text-red-700" x-text="errorMessage"></p>
                    </div>

                    <!-- Login Button -->
                    <button type="submit" :disabled="loading"
                        class="w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 disabled:from-gray-400 disabled:to-gray-400 text-white font-bold py-3 px-6 rounded-lg transition duration-200 flex items-center justify-center gap-2">
                        <span x-show="!loading">
                            <i class="ri-login-box-line"></i>
                            تسجيل الدخول
                        </span>
                        <span x-show="loading" class="flex items-center gap-2">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                </path>
                            </svg>
                            جاري التحقق...
                        </span>
                    </button>
                </form>

                <!-- Info Box -->
                <div class="mt-6 bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <div class="flex gap-3">
                        <i class="ri-information-line text-blue-600 text-xl flex-shrink-0"></i>
                        <div class="text-sm text-blue-800">
                            <p class="font-semibold mb-1">💡 ملاحظة أمنية:</p>
                            <p>كلمة المرور محفوظة في ملف config.js. لتغييرها، قم بتعديل المتغير adminPassword.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-6 text-center">
            <p class="text-white text-sm opacity-90">
                نظام إدارة المتجر الإلكتروني
            </p>
            <p class="text-blue-100 text-xs mt-1">
                جميع الحقوق محفوظة © <span x-text="new Date().getFullYear()"></span>
            </p>
        </div>
    </div>

    <!-- Configuration -->
    <script src="../public/config.js"></script>

    <!-- Alpine Component -->
    <script>
        function loginPanel() {
            return {
                password: '',
                showPassword: false,
                loading: false,
                errorMessage: '',
                attempts: 0,
                maxAttempts: 5,

                init() {
                    // Check if already logged in
                    if (this.isLoggedIn()) {
                        window.location.href = 'index.html';
                    }

                    // Check if locked out
                    if (this.isLockedOut()) {
                        this.errorMessage = 'تم قفل النظام مؤقتاً بسبب محاولات تسجيل دخول فاشلة متعددة. حاول مرة أخرى بعد 15 دقيقة.';
                    }
                },

                async login() {
                    // Reset error
                    this.errorMessage = '';

                    // Check if locked out
                    if (this.isLockedOut()) {
                        this.errorMessage = 'تم قفل النظام مؤقتاً. حاول مرة أخرى بعد 15 دقيقة.';
                        return;
                    }

                    // Validate input
                    if (!this.password || this.password.trim().length === 0) {
                        this.errorMessage = 'يرجى إدخال كلمة المرور';
                        return;
                    }

                    this.loading = true;

                    // Simulate network delay (for security)
                    await new Promise(resolve => setTimeout(resolve, 800));

                    // Get admin password from config
                    const correctPassword = window.StoreConfig?.admin?.password || 'admin123';

                    // Check password
                    if (this.password === correctPassword) {
                        // Success
                        this.setLoggedIn();
                        this.clearLoginAttempts();

                        // Redirect to dashboard
                        window.location.href = 'index.html';
                    } else {
                        // Failed
                        this.attempts = this.getLoginAttempts() + 1;
                        this.setLoginAttempts(this.attempts);

                        const remaining = this.maxAttempts - this.attempts;

                        if (remaining <= 0) {
                            this.lockOut();
                            this.errorMessage = 'تم قفل النظام بسبب محاولات تسجيل دخول فاشلة متعددة. حاول مرة أخرى بعد 15 دقيقة.';
                        } else {
                            this.errorMessage = `❌ كلمة مرور خاطئة. المحاولات المتبقية: ${remaining}`;
                        }

                        this.password = '';
                    }

                    this.loading = false;
                },

                // Session management
                isLoggedIn() {
                    const session = localStorage.getItem('admin_session');
                    if (!session) return false;

                    try {
                        const data = JSON.parse(session);
                        const now = Date.now();

                        // Session valid for 24 hours
                        if (now - data.timestamp < 24 * 60 * 60 * 1000) {
                            return true;
                        }
                    } catch (e) {
                        console.error('Invalid session data');
                    }

                    return false;
                },

                setLoggedIn() {
                    const session = {
                        timestamp: Date.now(),
                        authenticated: true
                    };
                    localStorage.setItem('admin_session', JSON.stringify(session));
                },

                // Login attempts tracking
                getLoginAttempts() {
                    const attempts = localStorage.getItem('login_attempts');
                    return attempts ? parseInt(attempts) : 0;
                },

                setLoginAttempts(count) {
                    localStorage.setItem('login_attempts', count.toString());
                },

                clearLoginAttempts() {
                    localStorage.removeItem('login_attempts');
                    localStorage.removeItem('lockout_until');
                },

                // Lockout management
                lockOut() {
                    const lockoutUntil = Date.now() + (15 * 60 * 1000); // 15 minutes
                    localStorage.setItem('lockout_until', lockoutUntil.toString());
                },

                isLockedOut() {
                    const lockoutUntil = localStorage.getItem('lockout_until');
                    if (!lockoutUntil) return false;

                    const now = Date.now();
                    const lockoutTime = parseInt(lockoutUntil);

                    if (now < lockoutTime) {
                        return true;
                    } else {
                        // Lockout expired, clear attempts
                        this.clearLoginAttempts();
                        return false;
                    }
                }
            };
        }
    </script>
</body>

</html>
