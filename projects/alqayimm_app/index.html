<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الدين القيم</title>
    <meta http-equiv="refresh" content="0; url=../../apps/alqayimm_app/">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Cairo', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        a {
            color: white;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>تطبيق الدين القيم</h1>
        <p>جاري التحويل...</p>
        <div class="spinner"></div>
        <p style="font-size: 0.9rem;">
            إذا لم يتم التحويل تلقائياً، 
            <a href="../../apps/alqayimm_app/">انقر هنا</a>
        </p>
    </div>
    <script>
        // Redirect after a short delay
        setTimeout(() => {
            window.location.href = '../../apps/alqayimm_app/';
        }, 100);
    </script>
</body>
</html>
